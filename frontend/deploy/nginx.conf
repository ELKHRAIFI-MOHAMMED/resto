# RestoFlow web server: the built React app + reverse proxy to the API.
# TLS is terminated in front of this container (see docs/deployment.md).

upstream restoflow_backend {
    server backend:8000;
}

# Keep the original scheme when a TLS proxy sits in front of nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    proxy_set_header Host $http_host;  # keeps the port, for absolute URLs
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;

    # Django: API, its own admin and static files, generated SEO files.
    location /api/          { proxy_pass http://restoflow_backend; }
    location /django-admin/ { proxy_pass http://restoflow_backend; }
    location /static/       { proxy_pass http://restoflow_backend; }
    location = /sitemap.xml { proxy_pass http://restoflow_backend; }
    location = /robots.txt  { proxy_pass http://restoflow_backend; }

    # Uploaded images, straight from the shared volume. Nothing there may run.
    location /media/ {
        alias /srv/media/;
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cache-Control "public" always;
        location ~* \.(?!(jpe?g|png|webp)$)[^.]+$ { return 404; }
    }

    # Fingerprinted build assets: cache forever.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # The single-page app: every other path renders index.html.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
